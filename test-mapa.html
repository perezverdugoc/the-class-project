<script>
document.querySelectorAll('.geo-s').forEach(function(p) {
  p.style.cursor = 'pointer';
  p.addEventListener('click', function() {
    document.getElementById('info').textContent = 'Zona: ' + p.dataset.zona + ' — ' + p.dataset.n;
  });
  p.addEventListener('mouseenter', function() { p.style.opacity = '0.8'; });
  p.addEventListener('mouseleave', function() { p.style.opacity = '1'; });
});
</script>
